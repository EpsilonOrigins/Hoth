[workspace]
resolver = "2"
members = [
    "apps/hoth-cli",
    "crates/hoth-catalog",
    "crates/hoth-clock",
    "crates/hoth-config",
    "crates/hoth-domain",
    "crates/hoth-publisher",
    "crates/hoth-orbits",
    "crates/hoth-scenario",
    "crates/hoth-dis",
    "crates/hoth-runtime",
    "crates/hoth-zenoh",
    "crates/hoth-fabric-adapter",
]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }

[workspace.package]
edition = "2021"
