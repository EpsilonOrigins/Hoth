[package]
name = "hoth-dis"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
hoth-domain = { path = "../hoth-domain" }
hoth-publisher = { path = "../hoth-publisher" }
serde = { version = "1", features = ["derive"] }
yaml_serde = "0.10"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
socket2 = "0.6"
