name: Local telemetry integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml config
      - run: docker compose config
      - run: bash scripts/e2e.sh
      - run: bash deploy/smoke.sh
      - run: bash scripts/dashboard-e2e.sh
