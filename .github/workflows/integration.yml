name: Container smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config
      - name: Build the runtime image
        run: docker compose -f deploy/compose.yaml build hoth
      - name: Verify the offline runtime
        run: bash deploy/smoke.sh
